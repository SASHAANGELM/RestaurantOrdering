worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Re-resolve after a backend recreate changes its container address.
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream api_backend {
        zone api_backend 64k;
        server backend:3000 resolve;
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        location = /health {
            access_log off;
            default_type text/plain;
            add_header Cache-Control "no-store";
            return 200 "healthy\n";
        }

        # Preserve the complete URI, including queries. Never use SPA fallback here.
        location ~ ^/(api|socket\.io)(/|$) {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 75s;
            proxy_send_timeout 75s;
            proxy_connect_timeout 3s;
            proxy_buffering off;
            proxy_next_upstream off;
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # Angular production filenames contain a content hash.
        location ~* "-[a-z0-9_-]{8,}\.(js|css|woff2?|png|svg|webp)$" {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location ~* \.(js|css|map|woff2?|png|ico|svg|webp)$ {
            try_files $uri =404;
            add_header Cache-Control "no-cache";
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
